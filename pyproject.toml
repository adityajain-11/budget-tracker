[project]
name = "budget-tracker"
version = "2.0.0"
description = "A small personal-finance CLI: expense tracking, category budgets, and charts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
budget-tracker = "budget_tracker.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["budget_tracker"]
[tool.ruff.lint]
# DTZ: this app only ever deals in calendar dates, not timezone-aware
# datetimes, so timezone-naive date construction is intentional here.
ignore = ["DTZ"]
